# Users granted cluster-admin on every cluster the `cluster-config` ApplicationSet
# selects. Each entry renders one ClusterRoleBinding named `cluster-admin-<user>`.
# Empty by default: a deployment lists its own users in cluster-admins.yaml,
# which the ApplicationSet reads when it exists. Removing an entry prunes its
# binding on the next automated sync.
#
# Entries must be Kubernetes usernames that are also valid in a DNS-1123
# resource name (lowercase alphanumeric, '-', or '.'); IdP-qualified names
# such as "user@domain" need a sanitized binding-name scheme first.
cluster_admins: []

hubResources:
  enabled: false

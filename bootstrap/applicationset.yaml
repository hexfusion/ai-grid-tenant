apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false
  generators:
    - git:
        repoURL: https://github.com/hexfusion/ai-grid-tenant.git
        revision: dagobah
        files:
          - path: apps/*/application.yaml
          - path: cluster-config/application.yaml
          # dagobah stores on LVMS and has no disks for ODF.
          - path: apps/odf/application.yaml
            exclude: true
  template:
    metadata:
      name: '{{.metadata.name}}'
      namespace: '{{.metadata.namespace}}'
    spec:
      project: '{{.spec.project}}'
      destination:
        server: '{{.spec.destination.server}}'
        namespace: '{{.spec.destination.namespace}}'
  templatePatch: |
    spec: {{ .spec | toJson }}

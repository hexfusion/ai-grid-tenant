apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  # The sites that run maas-api: role ingress or combined (apps/ai-grid-spokes).
  name: maas-db-clusters
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            ai-grid/enabled: "true"
          matchExpressions:
            - key: ai-grid/role
              operator: In
              values: [ingress, combined]
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: maas-db-remote-clusters
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
  # Those of them that aren't the hub, which holds the primary.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            ai-grid/enabled: "true"
          matchExpressions:
            - key: ai-grid/role
              operator: In
              values: [ingress, combined]
            - key: local-cluster
              operator: NotIn
              values:
                - "true"

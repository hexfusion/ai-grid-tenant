apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: maas-db
  namespace: openshift-gitops
  annotations:
    # Before the wave 3 Policies, which stay NonCompliant until the primary it creates exists.
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # No preserveResourcesOnDeletion here, unlike rhoai: a replica is a full copy
  # of every tenant's API keys and subscriptions, with the replication
  # credentials, so a site that leaves the grid, or the ingress role, loses it
  # with its Application. The primary is protected separately (below).
  generators:
    # The primary on the hub, whatever the hub's labels: it holds every
    # tenant's API keys and subscriptions, so no label edit, Remove or briefly
    # empty Placement decision may delete it. Its Cluster also carries
    # Delete=false (apps/maas-db/primary/10-primary.yaml).
    - clusters:
        selector:
          matchLabels:
            apps.open-cluster-management.io/acm-cluster: "true"
            local-cluster: "true"
    # A read replica on every other site that runs MaaS: role ingress or
    # combined (apps/ai-grid-spokes). The Placement's live decisions,
    # not the Secret's labels alone, as in the rhoai ApplicationSet.
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: ai-grid-ingress
              requeueAfterSeconds: 60
          - clusters:
              selector:
                matchLabels:
                  apps.open-cluster-management.io/acm-cluster: "true"
                  name: '{{ .clusterName }}'
                matchExpressions:
                  - key: local-cluster
                    operator: NotIn
                    values:
                      - "true"
  template:
    metadata:
      name: 'maas-db-{{.name}}'
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/hexfusion/ai-grid-tenant.git
        targetRevision: main
        path: '{{ if eq (index .metadata.labels "local-cluster") "true" }}apps/maas-db/primary{{ else }}apps/maas-db/read-clusters{{ end }}'
      destination:
        server: '{{.server}}'
        namespace: maas-db
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        retry:
          refresh: true
          limit: 20
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 30m
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true

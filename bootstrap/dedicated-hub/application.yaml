apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Generated by the root ApplicationSet so that the ApplicationSet manages
  # itself: this Application syncs the directory containing applicationset.yaml,
  # so edits to the generator list or templatePatch are applied automatically.
  name: dedicated-hub-root
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/hexfusion/ai-grid-tenant.git
    targetRevision: main
    path: bootstrap/dedicated-hub
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m

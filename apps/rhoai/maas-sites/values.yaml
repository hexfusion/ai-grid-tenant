# -- Render anything at all. The rhoai ApplicationSet sets this from the site's
# ai-grid/role label: false for inference, true for ingress and combined.
enabled: true

authorino:
  # -- The Authorino CR the RHCL operator owns on a MaaS site.
  name: authorino
  namespace: kuadrant-system
  # -- Trust anchors mounted into Authorino: the cluster trust bundle (carries the proxy
  # trustedCA) and the service CA. Both are present in every RHOAI-managed namespace.
  trust:
    mountPath: /etc/pki/tls/certs
    configMaps:
      - odh-trusted-ca-bundle
      - openshift-service-ca.crt
  # -- spec.volumes.items is replaced whole by the patch: list any volume item Authorino
  # already mounts, per site in values-<cluster>.yaml.
  extraVolumeItems: []

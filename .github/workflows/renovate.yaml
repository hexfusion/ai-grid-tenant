name: Renovate
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}
jobs:
  renovate:
    # The config names the upstream repository; a fork's GITHUB_TOKEN cannot maintain it.
    if: github.repository == 'ai-grid-cloud/ai-grid-cluster-gitops'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.8
        with:
          configurationFile: renovate-config.js
          token: ${{ secrets.GITHUB_TOKEN }}
          additional-env-list: |
            QUAY_USERNAME
            QUAY_PASSWORD
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

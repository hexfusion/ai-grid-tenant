mode: external
fullnameOverride: grid-bootstrap
# Grid v0.3.0-rc.2 enrollment from the RHDS build at bca253e, matching apps/rhoai/values.yaml.
image:
  repository: quay.io/sbatsche/grid-enrollment
  digest: sha256:61a25e6260b0b26eaf8e78883337b3983ec5574aaeace424902a6c4a3cb29770
gridIdentity:
  enabled: true
grid:
  membership:
    source: Local
managedClusters:
  enabled: true
  networkName: grid
  clusterSet: global
  clusterLabel: ai-grid/enabled
  clusterLabelValue: 'true'
  # The rhoai hub manifests own the shared binding.
  createClusterSetBinding: true
  hubClusterName: local-cluster
external:
  delivery:
    namespace: redhat-ai-grid
  certManager:
    enabled: true
    issuer:
      create: true
      name: grid-ca
    ca:
      # Preserve the existing CA while external issuance takes over identities.
      mode: Generate
      secretName: grid-ca-key

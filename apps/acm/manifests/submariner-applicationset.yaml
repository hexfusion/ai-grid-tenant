apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: acm-submariner
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            apps.open-cluster-management.io/acm-cluster: "true"
  template:
    metadata:
      name: 'acm-submariner-{{ .name }}'
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/hexfusion/ai-grid-tenant.git
        targetRevision: dagobah
        path: apps/acm/submariner
        helm:
          releaseName: acm-submariner
          parameters:
            - name: clusterName
              value: '{{ .name }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: open-cluster-management
      ignoreDifferences:
        - group: addon.open-cluster-management.io
          kind: ManagedClusterAddOn
          jsonPointers:
            - /metadata/finalizers
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true

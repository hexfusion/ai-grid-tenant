apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Keycloak as the hub runs it, without its public-URL Policy: on the external-services cluster
# that ConfigMap comes from apps/external-services/hub.
resources:
  - ../../keycloak
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: keycloak-public-url-templating
        namespace: maas-db
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: keycloak-public-url-templating
        namespace: maas-db
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: keycloak-public-url-templating
        namespace: maas-db
  - patch: |-
      $patch: delete
      apiVersion: cluster.open-cluster-management.io/v1beta1
      kind: Placement
      metadata:
        name: keycloak-public-url-clusters
        namespace: maas-db
  - patch: |-
      $patch: delete
      apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      metadata:
        name: keycloak-public-url
        namespace: maas-db
  - patch: |-
      $patch: delete
      apiVersion: policy.open-cluster-management.io/v1
      kind: PlacementBinding
      metadata:
        name: keycloak-public-url
        namespace: maas-db

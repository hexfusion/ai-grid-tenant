# The catalog: models and subscriptions the provider console commits to
# ai-grid-cloud/ai-grid-shared-catalog. Models go to inference and combined spokes
# (Placement ai-grid-inference), MaaS objects to ingress and combined spokes
# (ai-grid-ingress); both Placements are apps/ai-grid-spokes'.
#
# Models: catalog/clusters/<cluster>/ lists the models placed on that cluster
# (catalog/models/<id>/deployment: the LLMInferenceService and its NetworkPolicy).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: acm-models-catalog-models
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # Deleting the ApplicationSet, or a cluster's folder, leaves models
  # running. The console removes a model by editing the cluster's list, which
  # it keeps (empty) after the last model.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    # The Placement's clusters, each joined with the catalog folder it reads:
    # no Application until the console has written that folder, so an empty
    # catalog shows no errors.
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: ai-grid-inference
              requeueAfterSeconds: 60
          - git:
              repoURL: https://github.com/ai-grid-cloud/ai-grid-shared-catalog.git
              revision: main
              directories:
                - path: 'catalog/clusters/{{.name}}'
  template:
    metadata:
      name: 'acm-models-catalog-models-{{.name}}'
      namespace: openshift-gitops
    spec:
      project: acm-models-catalog-models
      source:
        repoURL: https://github.com/ai-grid-cloud/ai-grid-shared-catalog.git
        targetRevision: main
        path: '{{.path.path}}'
        kustomize: {}
      destination:
        server: '{{.server}}'
        namespace: ai-grid-internal-models
      syncPolicy:
        # allowEmpty: Argo CD otherwise refuses to prune to nothing.
        automated:
          prune: true
          selfHeal: true
          allowEmpty: true
        retry:
          refresh: true
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
        syncOptions:
          - SkipDryRunOnMissingResource=true
          # Never adopt an object another Application manages, such as a
          # sample model. A colliding file stops that cluster's catalog sync
          # until it's fixed.
          - FailOnSharedResource=true
---
# Each ingress and combined spoke registers every catalog model in MaaS: catalog/ingress/ is a
# kustomization of catalog/models/<id>/catalog (the ExternalModel and
# MaaSModelRef), as maas-externalmodels does for the sample model.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: acm-models-catalog-ingress
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # The Placement's clusters, each joined with the catalog folder it reads:
    # no Application until the console has written that folder, so an empty
    # catalog shows no errors.
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: ai-grid-ingress
              requeueAfterSeconds: 60
          - git:
              repoURL: https://github.com/ai-grid-cloud/ai-grid-shared-catalog.git
              revision: main
              directories:
                - path: 'catalog/ingress'
  template:
    metadata:
      name: 'acm-models-catalog-ingress-{{.name}}'
      namespace: openshift-gitops
      # Fail closed: deleting the Application (or the ApplicationSet) deletes
      # what it delivered, so no subscription or auth policy outlives it.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: acm-models-catalog-maas
      source:
        repoURL: https://github.com/ai-grid-cloud/ai-grid-shared-catalog.git
        targetRevision: main
        path: '{{.path.path}}'
        kustomize: {}
      destination:
        server: '{{.server}}'
        namespace: models-as-a-service
      syncPolicy:
        # allowEmpty: Argo CD otherwise refuses to prune to nothing.
        automated:
          prune: true
          selfHeal: true
          allowEmpty: true
        retry:
          refresh: true
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
        syncOptions:
          - SkipDryRunOnMissingResource=true
          # Never adopt an object another Application manages, such as a
          # sample model. A colliding file stops that cluster's catalog sync
          # until it's fixed.
          - FailOnSharedResource=true
---
# Each ingress and combined spoke gets every subscription: catalog/subscriptions/<id>.yaml, a
# MaaSSubscription and its <id>-policy MaaSAuthPolicy.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: acm-models-catalog-subscriptions
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # The Placement's clusters, each joined with the catalog folder it reads:
    # no Application until the console has written that folder, so an empty
    # catalog shows no errors.
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: ai-grid-ingress
              requeueAfterSeconds: 60
          - git:
              repoURL: https://github.com/ai-grid-cloud/ai-grid-shared-catalog.git
              revision: main
              directories:
                - path: 'catalog/subscriptions'
  template:
    metadata:
      name: 'acm-models-catalog-subscriptions-{{.name}}'
      namespace: openshift-gitops
      # Fail closed: deleting the Application (or the ApplicationSet) deletes
      # what it delivered, so no subscription or auth policy outlives it.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: acm-models-catalog-maas
      source:
        repoURL: https://github.com/ai-grid-cloud/ai-grid-shared-catalog.git
        targetRevision: main
        path: '{{.path.path}}'
        directory:
          include: "*.yaml"
      destination:
        server: '{{.server}}'
        namespace: models-as-a-service
      syncPolicy:
        # allowEmpty: Argo CD otherwise refuses to prune to nothing.
        automated:
          prune: true
          selfHeal: true
          allowEmpty: true
        retry:
          refresh: true
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
        syncOptions:
          - SkipDryRunOnMissingResource=true
          # Never adopt an object another Application manages, such as a
          # sample model. A colliding file stops that cluster's catalog sync
          # until it's fixed.
          - FailOnSharedResource=true

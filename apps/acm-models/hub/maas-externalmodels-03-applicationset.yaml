apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: acm-models-maas-externalmodels
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            apps.open-cluster-management.io/acm-cluster: "true"
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: 'acm-models-maas-externalmodels-{{.name}}'
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/hexfusion/ai-grid-tenant.git
        targetRevision: dagobah
        path: apps/acm-models/externalmodels
      destination:
        server: '{{.server}}'
        namespace: models-as-a-service
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true

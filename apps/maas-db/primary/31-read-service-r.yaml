apiVersion: v1
kind: Service
metadata:
  # maas-api's read endpoint on every site. A remote site's one-instance replica cluster
  # labels its instance role=primary, so only the -r Service (every ready instance) has an
  # endpoint there; on the hub the name points at the primary cluster's replicas.
  name: maas-read-r
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    # Part of the primary database: deleting the Application never deletes it.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  type: ExternalName
  externalName: maas-db-ro.maas-db.svc.cluster.local

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Only a dedicated hub syncs this. On a hub that is also a site, the RHOAI
  # app installs cert-manager, so the default root ApplicationSet excludes it.
  name: cert-manager
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/hexfusion/ai-grid-tenant.git
    targetRevision: lab/acm-hub
    path: apps/cert-manager/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true

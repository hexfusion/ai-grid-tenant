apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: maas-db
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # The system of record for every tenant's API keys and subscriptions:
    # deleting the Application, or pruning, never deletes it.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  instances: 3
  certificates:
    serverAltDNSNames:
      - maas-db-rw.maas-db.svc.clusterset.local
  bootstrap:
    initdb:
      database: maas
      owner: maas_api
  storage:
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred

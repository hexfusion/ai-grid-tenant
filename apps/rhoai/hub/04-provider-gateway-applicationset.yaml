apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # One provider gateway per site where models run (the ai-grid-inference
  # Placement: role inference or combined), from one values file: the operator's
  # provider file supplies the backends and the admitted peers.
  name: grid-provider-gateway
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: true
  syncPolicy:
    # Removing the label stops managing a cluster's workloads; it does not uninstall them.
    preserveResourcesOnDeletion: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # The Placement's live decisions joined with Argo CD's cluster Secret
    # for the server, as in the rhoai ApplicationSet.
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: ai-grid-inference
              requeueAfterSeconds: 60
          - clusters:
              selector:
                matchLabels:
                  apps.open-cluster-management.io/acm-cluster: "true"
                  name: '{{ .clusterName }}'
  template:
    metadata:
      name: 'grid-provider-gateway-{{ .name | trunc 30 }}-{{ sha256sum .name | trunc 8 }}'
      namespace: openshift-gitops
    spec:
      project: default
      sources:
        - repoURL: https://github.com/hexfusion/ai-grid-tenant.git
          targetRevision: main
          ref: values
        - repoURL: https://github.com/opendatahub-io/odh-gitops.git
          targetRevision: feature-ai-grid
          path: charts/rhai-on-openshift-chart/charts/praxis-gateway
          helm:
            releaseName: grid-provider-gateway
            valueFiles:
              - $values/apps/rhoai/provider-gateway.yaml
            parameters:
              - name: grid.siteName
                value: '{{ .name }}'
            # The ingress policy group admits the router, on the host network too (OVN
            # expands it to the nodes' management addresses). A site whose gateway sees
            # peers as node machine addresses adds that network with the ManagedCluster
            # label ai-grid/machine-network=<IPv4 CIDR, _ for />, prefix 1-32; any other
            # value renders a cidr no parser accepts, so the sync fails.
            values: |
              networkPolicy:
                from:
                  - podSelector:
                      matchLabels:
                        grid.opendatahub.io/gateway-client: "true"
                  - namespaceSelector:
                      matchLabels:
                        network.openshift.io/policy-group: ingress
                  {{- with index .metadata.labels "ai-grid/machine-network" }}
                  - ipBlock:
                      {{- if regexMatch "^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])_([1-9]|[12][0-9]|3[0-2])$" . }}
                      cidr: {{ replace "_" "/" . | quote }}
                      {{- else }}
                      cidr: {{ printf "invalid ai-grid/machine-network label %s" . | quote }}
                      {{- end }}
                  {{- end }}
      # Same destination rule as the rhoai Applications: the hub through Argo's in-cluster server.
      destination:
        server: '{{ if eq (index .metadata.labels "local-cluster") "true" }}https://kubernetes.default.svc{{ else }}{{ .server }}{{ end }}'
        namespace: redhat-ai-grid
      ignoreDifferences:
        - group: ""
          kind: Service
          name: grid-provider-gateway
          namespace: redhat-ai-grid
          jsonPointers:
            - /spec/type
          jqPathExpressions:
            - '.metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-internal"]'
            - '.metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]'
            - '.spec.ports[] | select(.name == "http") | .nodePort'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          refresh: true
          limit: 20
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 30m
        syncOptions:
          - CreateNamespace=false
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true

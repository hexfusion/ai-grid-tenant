apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: rhoai-prerequisites
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-namespaces
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: redhat-ai-grid
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: redhat-ods-operator
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: ai-grid-internal-models
                  annotations:
                    argocd.argoproj.io/sync-wave: "0"
                  labels:
                    # Identifies the namespace as allowed for Grid routing (automatically creates InferenceProvider for each LLMInferenceService in this namespace).
                    grid.opendatahub.io/allowed: "true"
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-namespaces-networkpolicies
        spec:
          remediationAction: enforce
          severity: high
          # Every AI project namespace, opted in with grid.opendatahub.io/allowed=true.
          namespaceSelector:
            matchLabels:
              grid.opendatahub.io/allowed: "true"
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  annotations:
                    argocd.argoproj.io/sync-wave: "2"
                  name: grid-gateway-backend
                spec:
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/part-of: llminferenceservice
                  policyTypes:
                    - Ingress
                  ingress:
                    - ports:
                        - port: 8000
                          protocol: TCP
                      from:
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: redhat-ai-grid
            # The monitoring and Grid rules isolate these pods. Preserve the
            # scheduler's engine polling and the serving gateway's data path.
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: llminference-engine-serving
                spec:
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/part-of: llminferenceservice
                      kserve.io/component: workload
                  policyTypes:
                    - Ingress
                  ingress:
                    - ports:
                        - port: 8000
                          protocol: TCP
                      from:
                        - podSelector:
                            matchLabels:
                              app.kubernetes.io/component: llminferenceservice-router-scheduler
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: openshift-ingress
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: llminference-scheduler-serving
                spec:
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/component: llminferenceservice-router-scheduler
                  policyTypes:
                    - Ingress
                  ingress:
                    - ports:
                        - port: 9002
                          protocol: TCP
                        - port: 9003
                          protocol: TCP
                      from:
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: openshift-ingress
            # RHOAI's collector scrapes the engine and scheduler monitors KServe labels for it.
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: rhoai-collector-metrics
                spec:
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/part-of: llminferenceservice
                  policyTypes:
                    - Ingress
                  ingress:
                    - ports:
                        - port: 8000
                          protocol: TCP
                        - port: 9090
                          protocol: TCP
                      from:
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: redhat-ods-monitoring
                          podSelector:
                            matchLabels:
                              app.kubernetes.io/component: opentelemetry-collector
                              app.kubernetes.io/instance: redhat-ods-monitoring.data-science-collector
    # The grid gateway dials each local model on the serving gateway's publisher path
    # as grid-model-client. The serving gateway's AuthPolicy authorizes that path with a
    # SubjectAccessReview for post on serving.opendatahub.io models. The pinned model
    # controller (ee3dcb8) also writes a per-model Role for that verb; this namespace-wide
    # grant keeps the client authorized while a model's Role is created or recreated.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: grid-model-client-models
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            matchLabels:
              grid.opendatahub.io/allowed: "true"
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: Role
                metadata:
                  name: grid-model-client-models
                rules:
                  - apiGroups:
                      - serving.opendatahub.io
                    resources:
                      - models
                    verbs:
                      - post
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: RoleBinding
                metadata:
                  name: grid-model-client-models
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: Role
                  name: grid-model-client-models
                subjects:
                  - kind: ServiceAccount
                    name: grid-model-client
                    namespace: redhat-ai-grid

    # odh-model-controller grants the grid model client `post` on each published model's
    # path; Kubernetes only lets it grant a verb it holds, and its bundled ClusterRole
    # (RHOAI 3.6 nightly, ee3dcb8) lacks `post`. This ClusterRole, bound per opted-in
    # namespace, supplies it. Remove both templates once the bundle grants the verb;
    # pruneObjectBehavior DeleteAll then removes the objects.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: odh-model-controller-grid-publisher
        spec:
          remediationAction: enforce
          severity: medium
          pruneObjectBehavior: DeleteAll
          object-templates:
            # mustonlyhave: this ClusterRole is tenant-owned, so Git is the whole truth of its rules.
            - complianceType: mustonlyhave
              metadataComplianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                metadata:
                  name: odh-model-controller-grid-publisher
                rules:
                  - apiGroups:
                      - serving.opendatahub.io
                    resources:
                      - models
                    verbs:
                      - post
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: odh-model-controller-grid-publisher-namespaces
        spec:
          remediationAction: enforce
          severity: medium
          pruneObjectBehavior: DeleteAll
          # Every AI project namespace, opted in with grid.opendatahub.io/allowed=true.
          namespaceSelector:
            matchLabels:
              grid.opendatahub.io/allowed: "true"
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: RoleBinding
                metadata:
                  name: odh-model-controller-grid-publisher
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: odh-model-controller-grid-publisher
                subjects:
                  - kind: ServiceAccount
                    name: odh-model-controller
                    namespace: redhat-ods-applications
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-image-mirror
        spec:
          remediationAction: enforce
          severity: low
          pruneObjectBehavior: DeleteAll
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: ImageDigestMirrorSet
                metadata:
                  name: quay-registry
                spec:
                  imageDigestMirrors:
                    - source: registry.redhat.io/rhoai
                      mirrors:
                        - quay.io/rhoai
                      mirrorSourcePolicy: NeverContactSource
                    - source: registry.redhat.io/rhaii
                      mirrors:
                        - registry.stage.redhat.io/rhaii
                      mirrorSourcePolicy: NeverContactSource
                    - source: registry.redhat.io/rhaii-early-access
                      mirrors:
                        - registry.stage.redhat.io/rhaii-early-access
                      mirrorSourcePolicy: NeverContactSource
                    - source: registry.redhat.io/rhaii-fast
                      mirrors:
                        - registry.stage.redhat.io/rhaii-fast
                      mirrorSourcePolicy: NeverContactSource
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-quay-pull-secret
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            {{hub- if (lookup "v1" "Secret" "rhoai-prerequisites" "rhoai-quay-pull-secret") hub}}
            {{hub- if (fromSecret "rhoai-prerequisites" "rhoai-quay-pull-secret" ".dockerconfigjson") hub}}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: rhoai-catalog-pull-secret
                  namespace: openshift-marketplace
                type: kubernetes.io/dockerconfigjson
                data:
                  .dockerconfigjson: '{{hub fromSecret "rhoai-prerequisites" "rhoai-quay-pull-secret" ".dockerconfigjson" hub}}'
            {{hub- end hub}}
            {{hub- end hub}}
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-global-pull-secret
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            {{- $sourceSecret := lookup "v1" "Secret" "openshift-marketplace" "rhoai-catalog-pull-secret" -}}
            {{- $globalSecret := lookup "v1" "Secret" "openshift-config" "pull-secret" -}}
            {{- if and $sourceSecret $globalSecret -}}
            {{- $sourceConfig := fromSecret "openshift-marketplace" "rhoai-catalog-pull-secret" ".dockerconfigjson" | base64dec | fromJson -}}
            {{- $globalConfig := fromSecret "openshift-config" "pull-secret" ".dockerconfigjson" | base64dec | fromJson -}}
            {{- $sourceAuths := index $sourceConfig "auths" -}}
            {{- $sourceAuth := index $sourceAuths "quay.io/rhoai" -}}
            {{- if not $sourceAuth -}}
            {{- $sourceAuth = index $sourceAuths "quay.io" -}}
            {{- end -}}
            {{- /* Every registry the hub Secret holds, e.g. registry.stage.redhat.io for the rhaii mirrors. A bare quay.io entry is scoped to quay.io/rhoai so the cluster's own quay.io login stays. */ -}}
            {{- $preRelease := omit $sourceAuths "quay.io" -}}
            {{- if $sourceAuth -}}
            {{- $_ := set $preRelease "quay.io/rhoai" $sourceAuth -}}
            {{- end -}}
            {{- /* Sprig merge gives the first argument precedence: the hub-held credentials must win for the registries they cover (quay.io/rhoai, registry.stage.redhat.io), otherwise a rotated or corrected credential never reaches the nodes. */ -}}
            {{- $mergedAuths := mustMerge $preRelease (index $globalConfig "auths") -}}
            {{- /* Replace the auths map wholesale. Merging the config here would again merge the nested auths entry by entry with the existing global values winning, so corrected credentials never land. */ -}}
            {{- $_ := set $globalConfig "auths" $mergedAuths -}}
            {{- $mergedConfig := $globalConfig -}}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: pull-secret
                  namespace: openshift-config
                type: kubernetes.io/dockerconfigjson
                data:
                  .dockerconfigjson: '{{ $mergedConfig | toJson | base64enc }}'
            {{- end -}}
    # The service CA as a Secret: the grid gateway's upstreamCA and the operator's
    # deriveTopology.transport.caSecretRef take a Secret, and the platform injects the
    # CA only as a ConfigMap. Lets the gateway verify the RHOAI serving gateway's cert.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-serving-gateway-ca
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{- if lookup "v1" "ConfigMap" "redhat-ai-grid" "openshift-service-ca.crt" -}}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: openshift-service-ca
                  namespace: redhat-ai-grid
                type: Opaque
                data:
                  ca.crt: '{{ fromConfigMap "redhat-ai-grid" "openshift-service-ca.crt" "service-ca.crt" | base64enc }}'
            {{- end -}}

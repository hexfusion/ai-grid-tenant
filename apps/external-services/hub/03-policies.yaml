# Both read the external-services cluster's own Route and Secrets where they are applied, so
# nothing about this cluster is copied through the hub.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: external-services-keycloak-public-url
  namespace: external-services
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: external-services-keycloak-public-url
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - maas-db
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: keycloak-public-url
                  namespace: maas-db
                data:
                  KEYCLOAK_PUBLIC_URL: '{{ printf "https://%s" (index (lookup "route.openshift.io/v1" "Route" "maas-db" "keycloak").status.ingress 0).host }}'
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: external-services-api-credentials
  namespace: external-services
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.DS
    policy.open-cluster-management.io/controls: PR.DS-1
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: external-services-api-connection
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - redhat-ai-gateway-infra
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: maas-db-config
                  namespace: redhat-ai-gateway-infra
                type: Opaque
                stringData:
                  DB_CONNECTION_URL: '{{ printf "postgresql://%s:%s@maas-db-rw.maas-db.svc.cluster.local:5432/%s?sslmode=require" (fromSecret "maas-db" "maas-db-app" "username" | base64dec | urlquery) (fromSecret "maas-db" "maas-db-app" "password" | base64dec | urlquery) (fromSecret "maas-db" "maas-db-app" "dbname" | base64dec) }}'
                  DB_READ_CONNECTION_URL: '{{ printf "postgresql://%s:%s@maas-read-ro.maas-db.svc.cluster.local:5432/%s?sslmode=require" (fromSecret "maas-db" "maas-db-app" "username" | base64dec | urlquery) (fromSecret "maas-db" "maas-db-app" "password" | base64dec | urlquery) (fromSecret "maas-db" "maas-db-app" "dbname" | base64dec) }}'

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: limitador-redis
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/hexfusion/ai-grid-tenant.git
    targetRevision: dagobah
    path: apps/limitador-redis/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: limitador-redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
  ignoreDifferences:
    - group: limitador.kuadrant.io
      kind: Limitador
      name: limitador
      namespace: kuadrant-system
      jsonPointers:
        - /spec/limits
        - /spec/metricLabelsDefault
        - /status

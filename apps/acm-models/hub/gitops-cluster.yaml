apiVersion: apps.open-cluster-management.io/v1beta1
kind: GitOpsCluster
metadata:
  # Creates Argo CD cluster secrets for every selected managed cluster.
  name: acm-models
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  argoServer:
    argoNamespace: openshift-gitops
  placementRef:
    apiVersion: cluster.open-cluster-management.io/v1beta1
    kind: Placement
    name: acm-models-gitops-cluster
    namespace: openshift-gitops
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  # Selects every managed cluster for Argo CD registration, including the
  # hub's own entry.
  name: acm-models-gitops-cluster
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterSets:
    - global

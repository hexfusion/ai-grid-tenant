refresh:
  enabled: true
  package: rhods-operator
  channel: stable-3.6
  catalogNamespace: openshift-marketplace
  subscriptionNamespace: redhat-ods-operator
  subscriptionName: rhods-operator
  image: registry.redhat.io/openshift4/ose-cli@sha256:75bd612f3d2b4dbddcbd7a48e12b5cb4d36e4a2683e7f48209e40596e0fbfc30
  # A freshly installed hub needs longer than a warm one for the catalog pod and
  # the Subscription to exist; the Job has backoffLimit 0, so the settle time
  # must cover it.
  catalogSettleSeconds: 180
  waitTimeoutSeconds: 600
  operatorRolloutTimeoutSeconds: 300
  # Job deadline. Leave unset to derive it from the three waits above plus a
  # 300 s margin for the Job's own API calls, so the deadline can never be shorter
  # than the waits it allows (a fixed value was, once the settle time grew).
  activeDeadlineSeconds: null
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

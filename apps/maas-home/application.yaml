apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Only a dedicated hub syncs this. On a hub that is also a site, MaaS's shared
  # state runs on the hub through the keycloak, limitador-redis, external-secrets
  # and maas-db apps, so the default root ApplicationSet excludes it.
  name: maas-home
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/hexfusion/ai-grid-tenant.git
    targetRevision: main
    path: apps/maas-home/hub
  # maas-db, created untracked, holds the rhoai app's tenant RBAC Role; this
  # app's own objects name the maas-home namespace.
  destination:
    server: https://kubernetes.default.svc
    namespace: maas-db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true

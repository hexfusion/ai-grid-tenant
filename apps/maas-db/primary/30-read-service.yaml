apiVersion: v1
kind: Service
metadata:
  name: maas-read-ro
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    # Part of the primary database: deleting the Application never deletes it.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  type: ExternalName
  externalName: maas-db-ro.maas-db.svc.cluster.local

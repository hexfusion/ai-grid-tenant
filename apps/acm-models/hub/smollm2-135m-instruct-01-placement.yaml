apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  # Selects managed cluster for Argo CD registration, including the
  # hub's own entry.
  name: acm-models-smollm2-135m-instruct
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        claimSelector:
          matchExpressions:
            - key: region.open-cluster-management.io
              operator: In
              values:
                - us-west-2

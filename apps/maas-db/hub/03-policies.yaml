apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: maas-db-replication-secrets
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.DS
    policy.open-cluster-management.io/controls: PR.DS-1
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: maas-db-replication-secrets
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - maas-db
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: maas-db-replication
                  namespace: maas-db
                type: kubernetes.io/tls
                data:
                  tls.crt: '{{hub fromSecret "maas-db" "maas-db-replication" "tls.crt" hub}}'
                  tls.key: '{{hub fromSecret "maas-db" "maas-db-replication" "tls.key" hub}}'
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: maas-db-ca
                  namespace: maas-db
                type: Opaque
                data:
                  ca.crt: '{{hub fromSecret "maas-db" "maas-db-ca" "ca.crt" hub}}'
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: maas-db-app
                  namespace: maas-db
                type: kubernetes.io/basic-auth
                data:
                  username: '{{hub fromSecret "maas-db" "maas-db-app" "username" hub}}'
                  password: '{{hub fromSecret "maas-db" "maas-db-app" "password" hub}}'
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: maas-db-api-credentials
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.DS
    policy.open-cluster-management.io/controls: PR.DS-1
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: maas-db-api-connection
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - redhat-ai-gateway-infra
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: maas-db-config
                  namespace: redhat-ai-gateway-infra
                type: Opaque
                stringData:
                  DB_CONNECTION_URL: '{{hub printf "postgresql://%s:%s@maas-db-rw.maas-db.svc.clusterset.local:5432/%s?sslmode=require" (fromSecret "maas-db" "maas-db-app" "username" | base64dec | urlquery) (fromSecret "maas-db" "maas-db-app" "password" | base64dec | urlquery) (fromSecret "maas-db" "maas-db-app" "dbname" | base64dec) hub}}'
                  DB_READ_CONNECTION_URL: '{{hub printf "postgresql://%s:%s@maas-read-r.maas-db.svc.cluster.local:5432/%s?sslmode=require" (fromSecret "maas-db" "maas-db-app" "username" | base64dec | urlquery) (fromSecret "maas-db" "maas-db-app" "password" | base64dec | urlquery) (fromSecret "maas-db" "maas-db-app" "dbname" | base64dec) hub}}'
